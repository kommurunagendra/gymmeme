name: gymtype
description: Gym Meme & Behaviour Tracking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.5
  firebase_storage: ^11.6.5

  # Local Storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  hive_flutter: ^1.1.0

  # Image & Media
  image_picker: ^1.0.7
  screenshot: ^2.3.0
  image_gallery_saver: ^2.0.3
  flutter_image_compress: ^2.1.0

  # ML Kit
  google_mlkit_face_detection: ^0.10.0

  # Sharing
  share_plus: ^7.2.2

  # Ads
  google_mobile_ads: ^4.0.0

  # UI
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1

  # Utils
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.3.3
  intl: ^0.19.0

  # Serialization
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
    - assets/images/
